name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # macOS matches the primary dev/host platform (node-pty prebuilds, sips).
    runs-on: macos-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
